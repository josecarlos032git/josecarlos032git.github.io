<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra de Dança - ARCA Cia das Artes</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a1a2f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background-color: #112b4d;
      padding: 20px 0;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .banner {
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
    }

    .banner img {
      width: 100%;
      border-radius: 12px;
    }

    .info {
      text-align: center;
      padding: 20px;
      background-color: #153a5b;
      border-radius: 12px;
      margin: 0 20px;
    }

    .info h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .info p {
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .info .highlight {
      color: #4fc3f7;
      font-weight: bold;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      background-color: #112b4d;
      text-align: center;
      font-size: 0.9rem;
      color: #bbbbbb;
    }
  </style>
</head>
<body>
  <header>
    <h1>ARCA Cia das Artes</h1>
  </header>

  <section class="banner">
    <img src="59aa441e-4150-40a2-8da7-cb40c40ea6c1.png" alt="Mostra de Dança">
  </section>

  <section class="info">
    <h2>Mostra de Dança</h2>
    <p><span class="highlight">1º de Maio</span> – <span class="highlight">19h00</span></p>
    <p>R. João Magela Luz, 15 – Céu Azul</p>
    <p>Belo Horizonte – MG</p>
    <p><span class="highlight">Entrada Gratuita</span></p>
    <p>Contato: (31) 99239-5413</p>
  </section>

  <footer>
    &copy; 2025 ARCA Cia das Artes. Todos os direitos reservados.
  </footer>
</body>
</html>
